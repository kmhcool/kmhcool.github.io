<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#153236">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <title>Wrong stop — kmhcool</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; padding: 24px; margin: 0; place-items: center; color: #fffdf8; background: #153236; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { width: min(100%, 760px); }
      .code { margin: 0; color: #c8f780; font: italic clamp(5rem, 24vw, 13rem)/.8 Georgia, serif; letter-spacing: -.08em; }
      h1 { max-width: 650px; margin: 38px 0 18px; font: 400 clamp(2.5rem, 7vw, 5.5rem)/.95 Georgia, serif; letter-spacing: -.055em; }
      p { max-width: 560px; color: rgba(255,255,255,.68); font-size: 1.08rem; }
      a { display: inline-block; padding: 13px 20px; margin-top: 20px; color: #153236; background: #ff6b48; border-radius: 999px; font-weight: 750; text-decoration: none; }
      a:hover { background: #c8f780; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This route doesn’t stop here.</h1>
      <p>The page may have moved, or the address took a wrong turn. The homepage is one stop away.</p>
      <a href="/">Return to kmhcool.win →</a>
    </main>
  </body>
</html>
